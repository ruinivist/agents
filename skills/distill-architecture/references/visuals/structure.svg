<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc">
  <title id="title">Order submission structure</title>
  <desc id="desc">A class diagram showing a checkout service using a payment contract, a concrete adapter implementing that contract, and the Cart and Order types used by the service.</desc>
  <defs>
    <marker id="open-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="1.5" />
    </marker>
    <marker id="hollow-triangle" markerWidth="17" markerHeight="17" refX="15" refY="8" orient="auto">
      <path d="M1 1 L15 8 L1 15 Z" fill="white" stroke="black" stroke-width="1.5" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <g fill="black" font-family="DejaVu Sans, sans-serif">
    <text x="750" y="46" font-size="31" text-anchor="middle" font-weight="bold">Order submission: structure</text>
    <text x="750" y="82" font-size="18" text-anchor="middle">
      <tspan fill="#1856a6">Blue: logic</tspan>
      <tspan> · </tspan>
      <tspan fill="#18713a">Green: data</tspan>
      <tspan> · </tspan>
      <tspan fill="#7435a0">Purple: contract</tspan>
    </text>

    <rect x="80" y="190" width="420" height="210" fill="white" stroke="black" stroke-width="2" />
    <path d="M80 245 H500" fill="none" stroke="black" stroke-width="2" />
    <path d="M80 310 H500" fill="none" stroke="black" stroke-width="2" />
    <text x="290" y="226" font-size="25" text-anchor="middle" font-weight="bold" fill="#1856a6">CheckoutService</text>
    <text x="100" y="282" font-size="20">− payment: PaymentPort</text>
    <text x="100" y="348" font-size="20">+ place(cart: Cart): Order</text>
    <text x="100" y="378" font-size="20">+ cancel(order_id: str): Result</text>

    <rect x="720" y="190" width="470" height="175" fill="white" stroke="black" stroke-width="2" />
    <path d="M720 250 H1190" fill="none" stroke="black" stroke-width="2" />
    <text x="955" y="220" font-size="18" text-anchor="middle">«interface»</text>
    <text x="955" y="241" font-size="25" text-anchor="middle" font-weight="bold" fill="#7435a0">PaymentPort</text>
    <text x="740" y="287" font-size="20">+ authorize(total: Money): Approval</text>
    <text x="740" y="326" font-size="20">+ refund(order_id: str): Result</text>

    <path d="M500 274 H720" fill="none" stroke="black" stroke-width="2" marker-end="url(#open-arrow)" />
    <text x="610" y="260" font-size="18" text-anchor="middle">payment: 1</text>

    <rect x="760" y="500" width="380" height="125" fill="white" stroke="black" stroke-width="2" />
    <path d="M760 552 H1140" fill="none" stroke="black" stroke-width="2" />
    <text x="950" y="535" font-size="25" text-anchor="middle" font-weight="bold" fill="#1856a6">CardAdapter</text>
    <text x="780" y="590" font-size="20">+ authorize(total): Approval</text>
    <text x="780" y="616" font-size="20">+ refund(order_id): Result</text>
    <path d="M950 500 V382" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#hollow-triangle)" />
    <text x="970" y="455" font-size="18">realizes</text>

    <rect x="80" y="555" width="385" height="145" fill="white" stroke="black" stroke-width="2" />
    <path d="M80 608 H465" fill="none" stroke="black" stroke-width="2" />
    <text x="272" y="590" font-size="25" text-anchor="middle" font-weight="bold" fill="#18713a">Cart</text>
    <text x="100" y="646" font-size="20">+ items: tuple[Item, ...]</text>
    <text x="100" y="678" font-size="20">+ total: Money</text>
    <path d="M285 400 V555" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open-arrow)" />
    <text x="300" y="490" font-size="18">uses as input</text>

    <rect x="1150" y="555" width="285" height="145" fill="white" stroke="black" stroke-width="2" />
    <path d="M1150 608 H1435" fill="none" stroke="black" stroke-width="2" />
    <text x="1292" y="590" font-size="25" text-anchor="middle" font-weight="bold" fill="#18713a">Order</text>
    <text x="1170" y="646" font-size="20">+ id: str</text>
    <text x="1170" y="678" font-size="20">+ status: Status</text>
    <path d="M500 365 H610 V735 H1290 V700" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#open-arrow)" />
    <text x="840" y="725" font-size="18" text-anchor="middle">returns as a type</text>

    <path d="M80 775 H1420" fill="none" stroke="black" stroke-width="1.5" />
    <text x="750" y="811" font-size="18" text-anchor="middle">Dashed arrows: dependencies and realization. Type use does not imply lifecycle ownership. Selected members shown.</text>
  </g>
</svg>
