<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">Order submission behavior</title>
  <desc id="desc">A UML sequence diagram: a caller submits an order, the service requests payment authorization, then saves and returns an order only when authorization is approved. A declined authorization returns a rejection without saving.</desc>
  <defs>
    <marker id="sync-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12 Z" fill="black" />
    </marker>
    <marker id="reply-arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12" fill="none" stroke="black" stroke-width="1.5" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="white" />
  <g fill="black" font-family="DejaVu Sans, sans-serif">
    <text x="700" y="46" font-size="31" text-anchor="middle" font-weight="bold">Order submission: behavior</text>
    <text x="700" y="80" font-size="18" text-anchor="middle">Time runs downward · solid filled arrow: synchronous call · dashed open arrow: reply</text>

    <rect x="95" y="125" width="190" height="58" fill="white" stroke="black" stroke-width="2" />
    <rect x="420" y="125" width="230" height="58" fill="white" stroke="black" stroke-width="2" />
    <rect x="800" y="125" width="220" height="58" fill="white" stroke="black" stroke-width="2" />
    <rect x="1130" y="125" width="220" height="58" fill="white" stroke="black" stroke-width="2" />
    <text x="190" y="162" font-size="22" text-anchor="middle" font-weight="bold">Caller</text>
    <text x="535" y="162" font-size="22" text-anchor="middle" font-weight="bold" fill="#1856a6">CheckoutService</text>
    <text x="910" y="162" font-size="22" text-anchor="middle" font-weight="bold" fill="#7435a0">PaymentPort</text>
    <text x="1240" y="162" font-size="22" text-anchor="middle" font-weight="bold" fill="#18713a">OrderStore</text>

    <path d="M190 183 V880 M535 183 V880 M910 183 V480 M1240 183 V880" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="8 7" />
    <rect x="526" y="225" width="18" height="655" fill="white" stroke="black" stroke-width="1.5" />
    <rect x="901" y="300" width="18" height="150" fill="white" stroke="black" stroke-width="1.5" />
    <rect x="1231" y="570" width="18" height="95" fill="white" stroke="black" stroke-width="1.5" />

    <path d="M190 240 H526" fill="none" stroke="black" stroke-width="2" marker-end="url(#sync-arrow)" />
    <text x="355" y="228" font-size="19" text-anchor="middle">place(cart)</text>
    <path d="M544 320 H901" fill="none" stroke="black" stroke-width="2" marker-end="url(#sync-arrow)" />
    <text x="720" y="308" font-size="19" text-anchor="middle">authorize(total)</text>
    <path d="M901 420 H544" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#reply-arrow)" />
    <text x="720" y="408" font-size="19" text-anchor="middle">approved or declined</text>

    <rect x="150" y="480" width="1200" height="380" fill="none" stroke="black" stroke-width="2" />
    <path d="M150 516 H1350" fill="none" stroke="black" stroke-width="2" />
    <rect x="150" y="480" width="64" height="36" fill="white" stroke="black" stroke-width="2" />
    <text x="182" y="505" font-size="18" text-anchor="middle" font-weight="bold">alt</text>
    <text x="230" y="505" font-size="18">[approved]</text>

    <path d="M544 590 H1231" fill="none" stroke="black" stroke-width="2" marker-end="url(#sync-arrow)" />
    <text x="885" y="578" font-size="19" text-anchor="middle">save(order)</text>
    <path d="M1231 650 H544" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#reply-arrow)" />
    <text x="885" y="638" font-size="19" text-anchor="middle">stored</text>
    <path d="M526 700 H190" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#reply-arrow)" />
    <text x="355" y="688" font-size="19" text-anchor="middle">order</text>

    <path d="M150 735 H1350" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" />
    <text x="230" y="762" font-size="18">[declined]</text>
    <path d="M526 815 H190" fill="none" stroke="black" stroke-width="2" stroke-dasharray="9 7" marker-end="url(#reply-arrow)" />
    <text x="355" y="803" font-size="19" text-anchor="middle">rejection · no save</text>

    <text x="750" y="903" font-size="18" text-anchor="middle">The store is called only in the approved branch; replies are dashed, not asynchronous messages.</text>
  </g>
</svg>
